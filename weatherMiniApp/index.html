<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Accurate weather of your city!">
    <title>Weather Mini App</title>
    <link rel="stylesheet" href="index.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="container">
        <div class="search_box">
            <i class='bx bxs-map'></i>
            <input type="text" placeholder="Enter your location">
            <button class="bx bx-search"></button>
        </div>

        <p class="city_name">City</p>

        <div class="weather_box">
            <div class="box">
                <div class="info_weather">
                    <div class="weather">
                        <img src="imgs/cloud.png" alt="Weather visual info">
                        <p class="temperature">0<span>°c</span></p>
                        <p class="description">Broken clouds</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="weather_details">
            <div class="humidity">
                <i class='bx bx-water'></i>
                <div class="text">
                    <div class="info_humidity">
                        <span>0%</span>
                    </div>
                    <p>Humidity</p>
                </div>
            </div>
            <div class="wind">
                <i class='bx bx-wind'></i>
                <div class="text">
                    <div class="info_wind">
                        <span>0Km/h</span>
                    </div>
                    <p>Wind speed</p>
                </div>
            </div>
        </div>

        <div class="not_found">
            <div class="box">
                <img src="imgs/404.png" alt="Not found image">
                <p>Location not found!</p>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
